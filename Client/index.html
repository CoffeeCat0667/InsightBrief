<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>InsightBrief</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <symbol id="i-crawl" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 2a8 8 0 1 1-8 8 8 8 0 0 1 8-8zm-1 4h2v5h-2zm0 6h2v2h-2z"/></symbol>

  <symbol id="i-audit" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 3 7v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V7l-9-5zm-1 6h2v7h-2V8zm0 9h2v2h-2v-2z"/></symbol>

  <symbol id="i-exit" viewBox="0 0 24 24"><path fill="currentColor" d="M10 17v2a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v2h2V5h8v14h-8v-2h-2zm-1.6-4H2a1 1 0 0 1 0-2h6.4l-2.2-2.2a1 1 0 1 1 1.4-1.4l4 4a1 1 0 0 1 0 1.4l-4 4a1 1 0 1 1-1.4-1.4l2.2-2.2z"/></symbol>
</svg>

<!-- 登录/注册壳 -->
<div id="auth-shell" class="auth-shell hidden"></div>

<!-- 主布局壳 -->
<div id="app-shell" class="hidden">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">IB</span><span class="brand-name">InsightBrief</span></div>
    <nav class="side-nav" id="side-nav"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn nav-toggle" id="nav-toggle" aria-label="菜单"><span class="burger"></span></button>
      <h1 class="page-title" id="page-title"></h1>
      <div class="topbar-right">
        <button class="btn ghost" id="admin-btn" style="display:none">管理面板</button>
        <button class="icon-btn" id="theme-toggle" aria-label="切换主题"></button>
        <div class="user-chip">
          <span class="user-avatar" id="user-avatar"></span>
          <span class="user-name" id="user-name"></span>
          <span class="role-badge" id="user-role"></span>
        </div>
        <button class="btn ghost" id="logout-btn">退出</button>
      </div>
    </header>
    <main class="content" id="view-root"></main>
  </div>
</div>

<div id="toast-root" class="toast-root"></div>

<script type="module" src="/js/router.js"></script>
</body>
</html>
