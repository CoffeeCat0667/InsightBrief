<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InsightBrief</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6ea; --ink: #1c2333; --muted: #6b7484;
  --accent: #2f5fe0; --accent-dark: #2348b8; --ok: #1e9e6a; --warn: #c47b16; --err: #cc3a3a;
  --radius: 10px; --shadow: 0 1px 3px rgba(20,30,60,.08), 0 4px 16px rgba(20,30,60,.06);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
}
.hidden { display: none !important; }
button { font: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; }
.btn {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 7px 14px; border-radius: 8px; transition: .15s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-dark); color: #fff; }
.btn.danger:hover { border-color: var(--err); color: var(--err); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 3px 9px; font-size: 12px; border-radius: 6px; }

/* ---------- 登录 ---------- */
#login-overlay {
  position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(160deg, #eef2fb, #f6f7f9 55%, #eef6f2);
}
#login-box {
  width: 340px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 34px 32px; box-shadow: var(--shadow);
}
#login-box h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .5px; }
#login-box p.sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.field input, .field select {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
  background: #fff;
}
.field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
#login-err { color: var(--err); font-size: 12.5px; min-height: 18px; margin: 0 0 8px; }

/* ---------- 布局 ---------- */
header {
  display: flex; align-items: center; gap: 18px; padding: 0 22px; height: 56px;
  background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 50;
}
header .brand { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
header .brand small { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 12px; }
nav { display: flex; gap: 4px; }
nav button.tab {
  border: none; background: none; padding: 7px 14px; border-radius: 8px; color: var(--muted); font-size: 14px;
}
nav button.tab:hover { background: #f0f2f6; }
nav button.tab.active { background: #e8eefc; color: var(--accent); font-weight: 600; }
header .spacer { flex: 1; }
#user-chip { color: var(--muted); font-size: 13px; }
#user-chip b { color: var(--ink); }

main { max-width: 1180px; margin: 0 auto; padding: 22px; }

.panel { display: none; }
.panel.active { display: block; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 18px; }
.card h2 { margin: 0 0 14px; font-size: 15px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.toolbar .grow { flex: 1; min-width: 200px; }
.toolbar input[type=text], .toolbar input[type=number], .toolbar select {
  padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 132px; overflow: auto; padding: 2px; }
.chip {
  border: 1px solid var(--line); background: #fff; border-radius: 999px;
  padding: 3px 11px; font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.all { font-weight: 600; }

/* ---------- 文章列表 ---------- */
.article-row {
  border: 1px solid var(--line); border-radius: var(--radius); background: #fff;
  padding: 13px 16px; margin-bottom: 10px; cursor: pointer; transition: .12s;
}
.article-row:hover { border-color: var(--accent); transform: translateY(-1px); }
.article-row .meta { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.article-row h3 { margin: 0 0 4px; font-size: 15px; line-height: 1.45; font-weight: 600; }
.article-row p { margin: 0; color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; background: #eef1f6; color: var(--muted); }
.tag.cat-pol, .tag.cat-culture, .tag.cat-eco, .tag.cat-tech, .tag.cat-other { background: #e8eefc; color: var(--accent-dark); }
.tag.dig { background: #fdf0e3; color: var(--warn); }

/* ---------- 进度 ---------- */
.progress-shell { border: 1px solid var(--line); border-radius: var(--radius); background: #fff; padding: 14px 16px; margin-bottom: 18px; }
.progress-shell.hide { display: none; }
.progress-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.progress-head .st { font-weight: 600; }
.progress-head .msg { color: var(--muted); font-size: 13px; flex: 1; }
.bar { height: 8px; background: #eef0f4; border-radius: 99px; overflow: hidden; margin-bottom: 10px; }
.bar i { display: block; height: 100%; width: 0%; background: var(--accent); border-radius: 99px; transition: width .4s; }
.bar i.done { background: var(--ok); }
.bar i.fail { background: var(--err); }
.run-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.run-table th, .run-table td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #f0f2f6; }
.run-table th { color: var(--muted); font-weight: 500; }
.ev-log { font-family: Consolas, monospace; font-size: 12px; color: var(--muted); background: #fafbfc; border: 1px solid #eef0f4; border-radius: 8px; padding: 10px 12px; max-height: 130px; overflow: auto; white-space: pre-wrap; margin-top: 8px; }
.ev-log .t { color: var(--warn); }

/* ---------- 任务表 ---------- */
table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
table.grid th, table.grid td { padding: 8px 10px; border-bottom: 1px solid #eef0f4; text-align: left; }
table.grid th { color: var(--muted); font-weight: 500; font-size: 12px; }
table.grid tr:last-child td { border-bottom: none; }
.status { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; }
.st-pending { background: #f0f2f6; color: var(--muted); }
.st-running { background: #e3edfd; color: var(--accent-dark); }
.st-completed { background: #e2f4ec; color: var(--ok); }
.st-failed { background: #fbe4e4; color: var(--err); }
.st-cancelled { background: #f0f2f6; color: var(--muted); }
.mini-bar { width: 120px; height: 6px; background: #eef0f4; border-radius: 99px; overflow: hidden; display: inline-block; vertical-align: middle; }
.mini-bar i { display: block; height: 100%; background: var(--accent); }

/* ---------- 简报卡片 ---------- */
.brief-card { border: 1px solid var(--line); border-radius: var(--radius); background: #fff; margin-bottom: 12px; overflow: hidden; }
.brief-head { padding: 13px 16px; display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.brief-head:hover { background: #fafbfc; }
.brief-head .tt { flex: 1; }
.brief-head .tt b { font-size: 14.5px; }
.brief-head .tt .sum { color: var(--muted); font-size: 13px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.brief-items { border-top: 1px solid var(--line); padding: 4px 16px 12px; }
.brief-item { padding: 11px 2px; border-bottom: 1px dashed #eef0f4; }
.brief-item:last-child { border-bottom: none; }
.brief-item .im { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 3px; flex-wrap: wrap; }
.brief-item a { font-size: 14px; font-weight: 600; color: var(--ink); text-decoration: none; }
.brief-item a:hover { color: var(--accent); }
.brief-item .sum { color: var(--muted); font-size: 13px; margin-top: 3px; }

/* ---------- 弹窗 ---------- */
.modal-mask { position: fixed; inset: 0; background: rgba(15,22,40,.45); z-index: 90; display: flex; align-items: center; justify-content: center; padding: 30px; }
.modal { background: var(--panel); border-radius: 14px; width: 860px; max-width: 100%; max-height: 88vh; overflow: auto; padding: 24px 28px; box-shadow: var(--shadow); }
.modal h2 { margin: 0 0 6px; font-size: 19px; line-height: 1.4; }
.modal .m-meta { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
.modal .m-body { font-size: 14.5px; }
.modal .m-body p { margin: 0 0 12px; }
.modal .m-close { position: sticky; top: 0; float: right; margin: -18px -20px 0 0; opacity: .6; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 13.5px; }
.pager { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 16px; color: var(--muted); font-size: 13px; }
.toast { position: fixed; right: 18px; bottom: 18px; z-index: 120; background: #1c2333; color: #fff; padding: 10px 16px; border-radius: 9px; font-size: 13px; box-shadow: var(--shadow); opacity: .96; }
.toast.err { background: var(--err); }
.spin { display: inline-block; width: 13px; height: 13px; border: 2px solid #c9d2e4; border-top-color: var(--accent); border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px; }
@keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="login-overlay">
  <div id="login-box">
    <h1>InsightBrief</h1>
    <p class="sub">新闻抓取 / 翻译 / AI 简报</p>
    <div class="field"><label>用户名</label><input id="login-user" autocomplete="username" spellcheck="false"></div>
    <div class="field"><label>密码</label><input id="login-pass" type="password" autocomplete="current-password"></div>
    <p id="login-err"></p>
    <button class="btn primary" id="login-btn" style="width:100%">登录</button>
  </div>
</div>

<header class="hidden" id="header">
  <div class="brand">InsightBrief<small>新闻阅读器</small></div>
  <nav>
    <button class="tab active" data-tab="articles">文章</button>
    <button class="tab" data-tab="briefs">简报</button>
    <button class="tab" data-tab="tasks">抓取任务</button>
  </nav>
  <div class="spacer"></div>
  <div id="user-chip"></div>
  <button class="btn small" id="logout-btn">退出</button>
</header>

<main class="hidden" id="main">

  <!-- ==================== 文章 ==================== -->
  <section id="panel-articles" class="panel active">
    <div class="card">
      <h2>文章列表</h2>
      <div class="toolbar">
        <input type="text" id="art-search" placeholder="关键词搜索(原文/译文)" class="grow">
        <select id="art-source" title="来源"></select>
        <select id="art-cat" title="分类">
          <option value="">全部分类</option>
          <option value="politics">政治</option>
          <option value="economy">经济</option>
          <option value="culture">文化</option>
          <option value="technology">科技</option>
        </select>
        <button class="btn" id="art-refresh">刷新</button>
      </div>
      <div id="art-list"></div>
      <div class="pager" id="art-pager"></div>
    </div>
  </section>

  <!-- ==================== 简报 ==================== -->
  <section id="panel-briefs" class="panel">
    <div class="card">
      <h2>生成简报</h2>
      <div class="toolbar">
        <select id="brief-cat" title="分类">
          <option value="">全部分类</option>
          <option value="politics">政治</option>
          <option value="economy">经济</option>
          <option value="culture">文化</option>
          <option value="technology">科技</option>
        </select>
        <input type="number" id="brief-max" min="1" max="500" value="20" title="文章上限" style="width:90px" placeholder="上限">
        <button class="btn primary" id="brief-start">开始生成</button>
        <span style="color:var(--muted);font-size:12.5px">对现有文章做 LLM 分类 / 摘要 / 综述(可并发)</span>
      </div>
      <div id="brief-progress"></div>
    </div>
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0">简报历史</h2>
        <div class="spacer"></div>
        <button class="btn small" id="briefs-refresh">刷新</button>
      </div>
      <div id="brief-list"></div>
    </div>
  </section>

  <!-- ==================== 抓取任务 ==================== -->
  <section id="panel-tasks" class="panel">
    <div class="card">
      <h2>触发抓取</h2>
      <div style="margin-bottom:10px;font-size:12.5px;color:var(--muted)">选择来源(不选 = 全部启用源):</div>
      <div class="chips" id="crawl-sources" style="margin-bottom:12px"></div>
      <div class="toolbar">
        <input type="number" id="crawl-max" min="1" max="500" value="30" title="每源文章上限" style="width:100px" placeholder="每源上限">
        <button class="btn primary" id="crawl-start">开始抓取</button>
        <span style="color:var(--muted);font-size:12.5px">人工触发, 与进行中任务源冲突将拒绝(409)</span>
      </div>
      <div id="crawl-progress"></div>
    </div>
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0">抓取任务</h2>
        <div class="spacer"></div>
        <button class="btn small" id="crawl-tasks-refresh">刷新</button>
      </div>
      <div id="crawl-tasks"></div>
    </div>
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0">简报任务</h2>
        <div class="spacer"></div>
        <button class="btn small" id="brief-tasks-refresh">刷新</button>
      </div>
      <div id="brief-tasks"></div>
    </div>
  </section>

</main>

<div id="modal-root"></div>

<script>
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeParse = s => { try { return JSON.parse(s); } catch { return null; } };

const CAT_CN = { politics: "政治", economy: "经济", culture: "文化", technology: "科技", other: "其他" };
const ST_CN = { pending: "排队中", running: "进行中", completed: "已完成", failed: "失败", cancelled: "已取消" };
const fmtTime = s => s ? new Date(s).toLocaleString("zh-CN", { hour12: false }) : "—";

let token = localStorage.getItem("ib_token") || "";
let me = null;
let allSources = [];
let crawlSelected = new Set();
let artPage = 1, artPageSize = 15, artTotal = 0, artSearching = false;
let briefPage = 1, briefPageSize = 10, briefTotal = 0;

/* ---------------- API ---------------- */
async function api(method, path, body) {
  const headers = { Authorization: "Bearer " + token };
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const resp = await fetch(path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
  let data = null;
  try { data = await resp.json(); } catch {}
  if (resp.status === 401) { logout(); throw new Error("登录已过期"); }
  if (!resp.ok) {
    const msg = (data && (data.error && data.error.message)) || ("HTTP " + resp.status);
    const err = new Error(msg); err.status = resp.status; throw err;
  }
  return data && data.data;
}
function toast(msg, err) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

/* ---------------- 登录 ---------------- */
async function tryLogin() {
  const u = $("#login-user").value.trim(), p = $("#login-pass").value;
  if (!u || !p) { $("#login-err").textContent = "请输入用户名和密码"; return; }
  $("#login-btn").disabled = true;
  try {
    const fd = new URLSearchParams();
    fd.set("username", u); fd.set("password", p);
    const resp = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: fd.toString(),
    });
    const data = await resp.json().catch(() => null);
    if (!resp.ok) { $("#login-err").textContent = (data && data.error && data.error.message) || "登录失败"; return; }
    token = data.data.access_token;
    localStorage.setItem("ib_token", token);
    await enterApp();
  } finally { $("#login-btn").disabled = false; }
}
function logout() {
  token = ""; me = null;
  localStorage.removeItem("ib_token");
  $("#main").classList.add("hidden"); $("#header").classList.add("hidden");
  $("#login-overlay").classList.remove("hidden");
  $("#login-pass").value = "";
}

async function enterApp() {
  me = await api("GET", "/api/auth/me");
  const isAdmin = me.role && me.role.code === "admin";
  $("#user-chip").innerHTML = "登录: <b>" + esc(me.username) + "</b>" +
    (isAdmin ? ' <span class="tag">管理员</span>' : ' <span class="tag">用户</span>');
  $("#login-overlay").classList.add("hidden");
  $("#header").classList.remove("hidden");
  $("#main").classList.remove("hidden");
  loadSources();
  loadArticles();
  loadBriefs();
  loadCrawlTasks(); loadBriefTasks();
}

/* ---------------- 来源 ---------------- */
async function loadSources() {
  const rows = await api("GET", "/api/sources?page=1&page_size=100");
  allSources = rows.items.filter(s => s.enabled !== false);
  renderCrawlChips();
  const sel = $("#art-source");
  sel.innerHTML = '<option value="">全部来源</option>' + allSources
    .map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("");
}
function renderCrawlChips() {
  const box = $("#crawl-sources");
  const all = crawlSelected.size === 0;
  box.innerHTML = `<span class="chip all ${all ? "on" : ""}" data-id="">${all ? "全部(勾选即定制)" : "全部"}</span>` +
    allSources.map(s =>
      `<span class="chip ${crawlSelected.has(s.id) ? "on" : ""}" data-id="${esc(s.id)}">${esc(s.name)}</span>`
    ).join("");
}
$("#crawl-sources").addEventListener("click", e => {
  const chip = e.target.closest(".chip"); if (!chip) return;
  const id = chip.dataset.id;
  if (id === "") { crawlSelected.clear(); }
  else if (crawlSelected.has(id)) crawlSelected.delete(id);
  else crawlSelected.add(id);
  renderCrawlChips();
});

/* ---------------- 文章 ---------------- */
async function loadArticles() {
  const kw = $("#art-search").value.trim();
  const params = new URLSearchParams({ page: artPage, page_size: artPageSize });
  const src = $("#art-source").value, cat = $("#art-cat").value;
  if (src) params.set("source_id", src);
  if (cat) params.set("category", cat);
  const box = $("#art-list");
  box.innerHTML = '<div class="empty"><span class="spin"></span> 加载中…</div>';
  try {
    let data;
    if (kw) { params.set("keyword", kw); data = await api("GET", "/api/articles/search?" + params); }
    else data = await api("GET", "/api/articles?" + params);
    artTotal = data.total;
    renderArticleRows(data.items);
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  renderArtPager();
}
function renderArticleRows(items) {
  const box = $("#art-list");
  if (!items.length) { box.innerHTML = '<div class="empty">暂无文章 — 到“抓取任务”页触发抓取</div>'; return; }
  box.innerHTML = items.map(a => `
    <div class="article-row" data-id="${a.id}">
      <div class="meta">
        <span class="tag">${esc(a.source_name || a.source_id)}</span>
        ${a.category ? `<span class="tag cat-${esc(a.category)}">${esc(CAT_CN[a.category] || a.category)}</span>` : ""}
        ${a.translated_title ? '<span class="tag dig">已翻译</span>' : ""}
        <span>${esc(a.publish_time || fmtTime(a.created_at))}</span>
      </div>
      <h3>${esc(a.translated_title || a.title)}</h3>
      ${a.summary ? `<p>${esc(a.summary)}</p>` : ""}
    </div>`).join("");
  $$(".article-row", box).forEach(r => r.addEventListener("click", () => openArticle(+r.dataset.id)));
}
function renderArtPager() {
  const pages = Math.max(1, Math.ceil(artTotal / artPageSize));
  $("#art-pager").innerHTML = `
    <button class="btn small" data-p="-1" ${artPage <= 1 ? "disabled" : ""}>上一页</button>
    <span>第 ${artPage} / ${pages} 页 (共 ${artTotal} 篇)</span>
    <button class="btn small" data-p="1" ${artPage >= pages ? "disabled" : ""}>下一页</button>`;
  $$("#art-pager button").forEach(b => b.addEventListener("click", () => {
    artPage += +b.dataset.p; artPage = Math.max(1, Math.min(pages, artPage)); loadArticles();
  }));
}
async function openArticle(id) {
  const mask = document.createElement("div");
  mask.className = "modal-mask";
  mask.innerHTML = '<div class="modal"><button class="btn small m-close">关闭</button><h2>加载中…</h2></div>';
  $("#modal-root").appendChild(mask);
  $(".m-close", mask).addEventListener("click", () => mask.remove());
  mask.addEventListener("click", e => { if (e.target === mask) mask.remove(); });
  try {
    const a = await api("GET", "/api/articles/" + id);
    const segs = (a.contents && a.contents.length ? a.contents : [])
      .filter(c => c.content).map(c => `<p>${esc(c.content)}</p>`).join("");
    const translated = a.translated_content ? `<h3>译文全文</h3><p>${esc(a.translated_content)}</p>` : "";
    $(".modal", mask).innerHTML = `

        ${esc(a.publish_time || fmtTime(a.created_at))} ·
        <a href="${esc(a.url)}" target="_blank" rel="noopener">原文链接</a>
        ${a.translated_title && a.translated_title !== a.title ? `<br>原文: ${esc(a.title)}` : ""}
      </div>
      <div class="m-body">${segs || (a.content ? `<p>${esc(a.content)}</p>` : '<div class="empty">该来源无正文片段(摘要型)</div>')}${translated}</div>`;
    $$(".m-close", mask).forEach(b => b.addEventListener("click", () => mask.remove()));
  } catch (e) { mask.remove(); toast(e.message, true); }
}

/* ---------------- SSE (fetch 流式, 可带 Authorization) ---------------- */
async function openSSE(path, handlers) {
  let resp;
  try {
    resp = await fetch(path, { headers: { Authorization: "Bearer " + token } });
  } catch (e) { handlers.error("连接失败: " + e.message); return; }
  if (!resp.ok) {
    const data = safeParse(await resp.text());
    handlers.error((data && data.error && data.error.message) || ("HTTP " + resp.status));
    return;
  }
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = "", ev = "", data = "";
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).replace(/\r$/, "");
        buf = buf.slice(i + 1);
        if (line === "") {
          if (ev) { handlers.event(ev, safeParse(data)); }
          ev = ""; data = ""; continue;
        }
        if (line.startsWith(":")) continue;
        if (line.startsWith("event:")) ev = line.slice(6).trim();
        else if (line.startsWith("data:")) data += line.slice(5).trim();
      }
    }
  } catch (e) { handlers.error("连接中断"); }
  handlers.done && handlers.done();
}

/* ---------------- 抓取任务 ---------------- */
function renderProgress(anchor, task, kind) {
  const pct = Math.max(0, Math.min(100, task.progress || 0));
  const terminal = ["completed", "failed", "cancelled"].includes(task.status);
  const barCls = task.status === "failed" ? "fail" : task.status === "completed" ? "done" : "";
  const runs = task.runs && task.runs.length
    ? `<table class="run-table"><tr><th>来源</th><th>状态</th><th>发现/成功/失败</th><th>说明</th></tr>` +
      task.runs.map(r => `<tr><td>${esc(r.source_id)}</td><td>${esc(ST_CN[r.status] || r.status)}</td>
        <td>${r.discovered_links ?? 0} / ${r.success_count ?? 0} / ${r.failed_count ?? 0}</td>
        <td>${esc((r.error && r.error.message) || "")}</td></tr>`).join("") + "</table>"
    : "";
  const stats = task.stats ? `<div class="ev-log">${esc(JSON.stringify(task.stats, null, 1))}</div>` : "";
  anchor.innerHTML = `
    <div class="progress-head">
      <span class="st st-${esc(task.status)}">${esc(task.status === "cancelled" ? "已取消" : task.status === "completed" ? "已完成" : task.status === "failed" ? "失败" : task.status === "running" ? "进行中" : "排队中")}</span>
      <span class="msg">${esc(task.stage || task.message || "")}</span>
      <span>${pct}%</span>
      ${terminal ? "" : `<button class="btn small danger" data-cancel>取消</button>`}
    </div>
    <div class="bar"><i class="${barCls}" style="width:${pct}%"></i></div>
    ${runs}${stats}`;
  const cb = $("[data-cancel]", anchor);
  if (cb) cb.addEventListener("click", () => cancelTask(kind, task.id));
}
async function cancelTask(kind, id) {
  try {
    await api("POST", `/api/${kind === "crawl" ? "crawl-tasks" : "brief-tasks"}/${id}/cancel`, {});
    toast("已请求取消");
  } catch (e) { toast(e.message, true); }
}

async function startCrawl() {
  const maxItems = Math.max(1, Math.min(500, parseInt($("#crawl-max").value || "30", 10)));
  const sourceIds = crawlSelected.size ? [...crawlSelected] : undefined;
  const box = $("#crawl-progress");
  box.innerHTML = '<div class="empty"><span class="spin"></span> 创建任务…</div>';
  const btn = $("#crawl-start"); btn.disabled = true;
  try {
    const task = await api("POST", "/api/crawl-tasks", sourceIds ? { source_ids: sourceIds, max_items: maxItems } : { max_items: maxItems });
    watchTask("crawl", task.id, box);
  } catch (e) {
    box.innerHTML = `<div class="progress-shell"><div class="progress-head"><span class="msg" style="color:var(--err)">${esc(e.message)}</span></div></div>`;
  } finally { btn.disabled = false; }
}
function watchTask(kind, id, box) {
  const anchor = document.createElement("div");
  anchor.className = "progress-shell";
  anchor.innerHTML = '<div class="empty"><span class="spin"></span> 连接进度通道…</div>';
  box.innerHTML = ""; box.appendChild(anchor);
  renderProgress(anchor, { status: "pending", progress: 0, stage: "排队中…", runs: [], stats: null, message: "" }, kind);
  const evPath = kind === "crawl" ? `/api/tasks/${id}/events` : `/api/brief-tasks/${id}/events`;
  const detailPath = kind === "crawl" ? `/api/crawl-tasks/${id}` : `/api/brief-tasks/${id}`;
  let seenTerminal = false;
  openSSE(evPath, {
    event(ev, data) {
      if (data && typeof data === "object") {
        renderProgress(anchor, data, kind);
        if (["task_completed", "task_failed", "task_cancelled", "brief_completed", "brief_failed", "brief_cancelled"].includes(ev)) {
          seenTerminal = true;
          if (kind === "brief") loadBriefs();
        }
      }
    },
    async error(msg) { renderProgress(anchor, { status: "failed", progress: 0, stage: msg, runs: [], stats: null, message: msg }, kind); },
    async done() {
      if (!seenTerminal) {
        try {
          const t = await api("GET", detailPath);
          if (["completed", "failed", "cancelled"].includes(t.status)) { renderProgress(anchor, t, kind); seenTerminal = true; }
        } catch {}
      }
      loadCrawlTasks(); loadBriefTasks();
      if (kind === "crawl") loadArticles();
    },
  });
}

/* ---------------- 简报 ---------------- */
async function startBrief() {
  const cat = $("#brief-cat").value;
  const max = parseInt($("#brief-max").value || "20", 10);
  const body = { max_items: Math.max(1, Math.min(500, max || 20)) };
  if (cat) body.category = cat;
  const box = $("#brief-progress");
  box.innerHTML = '<div class="empty"><span class="spin"></span> 创建简报任务…</div>';
  const btn = $("#brief-start"); btn.disabled = true;
  try {
    const task = await api("POST", "/api/brief-tasks", body);
    watchTask("brief", task.id, box);
  } catch (e) {
    box.innerHTML = `<div class="progress-shell"><div class="progress-head"><span class="msg" style="color:var(--err)">${esc(e.message)}</span></div></div>`;
  } finally { btn.disabled = false; }
}
async function loadBriefs() {
  const box = $("#brief-list");
  box.innerHTML = '<div class="empty"><span class="spin"></span> 加载中…</div>';
  try {
    const data = await api("GET", `/api/briefs?page=${briefPage}&page_size=${briefPageSize}`);
    briefTotal = data.total;
    if (!data.items.length) { box.innerHTML = '<div class="empty">暂无简报 — 在上方选择条件后开始生成</div>'; return; }
    box.innerHTML = data.items.map(b => `
      <div class="brief-card">
        <div class="brief-head">
          <div class="tt">
            <b>${esc(b.title || (CAT_CN[b.category] || "综合") + "简报")}</b>
            <div class="sum">${esc(b.summary || "")}</div>
            <div style="margin-top:6px;font-size:12px;color:var(--muted)">
              ${b.category ? `<span class="tag cat-${esc(b.category)}">${esc(CAT_CN[b.category] || b.category)}</span>` : '<span class="tag">综合</span>'}
              ${(b.items || []).length} 篇 · ${fmtTime(b.generated_at || b.created_at)}
            </div>
          </div>
        </div>
        <div class="brief-items hidden">
          ${(b.items || []).map(it => `
            <div class="brief-item">
              <div class="im">
                <span class="tag">${esc(it.source_name || "")}</span>
                ${it.category ? `<span class="tag">${esc(CAT_CN[it.category] || it.category)}</span>` : ""}
                ${it.meta ? `<span class="tag dig">降级: ${esc(it.meta.degraded || "?")}</span>` : ""}
              </div>
              <a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title_cn || it.url)}</a>
              ${it.summary ? `<div class="sum">${esc(it.summary)}</div>` : ""}
            </div>`).join("") || '<div class="empty">无条目</div>'}
        </div>
      </div>`).join("");
    $$(".brief-head", box).forEach((h, ix) => h.addEventListener("click", () => {
      $(".brief-items", h.parentElement).classList.toggle("hidden");
    }));
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/* ---------------- 任务列表 ---------------- */
async function loadCrawlTasks() {
  const box = $("#crawl-tasks");
  try {
    const data = await api("GET", "/api/crawl-tasks?page=1&page_size=20");
    if (!data.items.length) { box.innerHTML = '<div class="empty">暂无抓取任务</div>'; return; }
    box.innerHTML = `<table class="grid">
      <tr><th>#</th><th>状态</th><th>进度</th><th>来源</th><th>阶段</th><th>时间</th><th></th></tr>` +
      data.items.map(t => `
        <tr>
          <td>${t.id}</td>
          <td><span class="status st-${esc(t.status)}">${esc(ST_CN[t.status] || t.status)}</span></td>
          <td><span class="mini-bar"><i style="width:${Math.max(0, Math.min(100, t.progress || 0))}%"></i></span> ${t.progress ?? 0}%</td>
          <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((t.source_ids || ["全部"]).join(", "))}</td>
          <td>${esc(t.stage || "")}</td>
          <td>${fmtTime(t.created_at)}</td>
          <td>${["pending", "running"].includes(t.status) ? `<button class="btn small danger" data-c="crawl" data-id="${t.id}">取消</button>` : ""}</td>
        </tr>`).join("") + "</table>";
    $$("[data-c]", box).forEach(b => b.addEventListener("click", () => cancelTask("crawl", +b.dataset.id)));
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
async function loadBriefTasks() {
  const box = $("#brief-tasks");
  try {
    const data = await api("GET", "/api/brief-tasks?page=1&page_size=20");
    if (!data.items.length) { box.innerHTML = '<div class="empty">暂无简报任务</div>'; return; }
    box.innerHTML = `<table class="grid">
      <tr><th>#</th><th>状态</th><th>进度</th><th>分类</th><th>参数</th><th>时间</th><th></th></tr>` +
      data.items.map(t => `
        <tr>
          <td>${t.id}</td>
          <td><span class="status st-${esc(t.status)}">${esc(ST_CN[t.status] || t.status)}</span></td>
          <td><span class="mini-bar"><i style="width:${Math.max(0, Math.min(100, t.progress || 0))}%"></i></span> ${t.progress ?? 0}%</td>
          <td>${esc(t.params && t.params.category ? (CAT_CN[t.params.category] || t.params.category) : "全部")}</td>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(JSON.stringify(t.params || {}))}</td>
          <td>${fmtTime(t.created_at)}</td>
          <td>${["pending", "running"].includes(t.status) ? `<button class="btn small danger" data-c="brief" data-id="${t.id}">取消</button>` : ""}</td>
        </tr>`).join("") + "</table>";
    $$("[data-c]", box).forEach(b => b.addEventListener("click", () => cancelTask("brief", +b.dataset.id)));
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
